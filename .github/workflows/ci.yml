name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# CI only reads source. Do not add deployment permissions or signing keys here.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  dotnet:
    name: .NET locked build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        # actions/checkout v6.0.2, pinned by commit rather than a movable tag.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install exact .NET SDK
        # actions/setup-dotnet v5.4.0, with Node 24 and exact SDK support.
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: 10.0.400

      - name: Verify SDK pin
        shell: bash
        run: |
          set -euo pipefail
          actual="$(dotnet --version)"
          test "$actual" = "10.0.400" || {
            echo "::error::Expected .NET SDK 10.0.400, got $actual"
            exit 1
          }

      - name: Restore locked dependency graph
        run: dotnet restore PaymentSandbox.slnx --locked-mode

      - name: Build
        run: dotnet build PaymentSandbox.slnx --configuration Release --no-restore

      - name: Test
        run: >-
          dotnet test PaymentSandbox.slnx
          --configuration Release
          --no-build
          --no-restore

  foundry:
    name: Foundry formatting, build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source and pinned contract dependencies
        # Recursive checkout resolves OpenZeppelin and forge-std to committed gitlinks.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: recursive

      - name: Install exact Foundry release
        # The repository installer selects the official Linux archive and verifies SHA-256.
        shell: pwsh
        run: ./scripts/install-foundry.ps1 -AddToPath

      - name: Verify Foundry pin
        shell: bash
        run: |
          set -euo pipefail
          forge --version
          forge --version | grep -Eq '(^|[^0-9])1\.7\.1([^0-9]|$)' || {
            echo "::error::forge is not v1.7.1"
            exit 1
          }

      - name: Check Solidity formatting
        working-directory: contracts
        run: forge fmt --check

      - name: Build contracts
        working-directory: contracts
        run: forge build --sizes

      - name: Test contracts
        working-directory: contracts
        run: forge test -vvv

  secrets:
    name: Secret scan (working rules and full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out complete Git history
        # Gitleaks git mode needs full history; a shallow clone only covers recent commits.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install checksum-verified Gitleaks 8.29.1
        shell: bash
        env:
          GITLEAKS_VERSION: 8.29.1
          GITLEAKS_ARCHIVE_SHA256: e4eb209d04e20339d77122a3bdf9cd41351255cfb27ebcb75e85325e04f88924
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          install_dir="$RUNNER_TEMP/gitleaks-${GITLEAKS_VERSION}"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"

          curl --fail --location --silent --show-error "$url" --output "$archive"
          echo "${GITLEAKS_ARCHIVE_SHA256}  ${archive}" | sha256sum --check
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" gitleaks
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Prove the scanner detects a synthetic secret
        shell: bash
        run: |
          set -euo pipefail
          canary_dir="$RUNNER_TEMP/gitleaks-canary-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          canary="$canary_dir/canary.txt"
          mkdir -p "$canary_dir"

          # Build a synthetic EVM key from fragments so the workflow itself has no finding.
          printf 'private_key = "0x%s%s"\n' \
            '0123456789abcdef0123456789abcdef' \
            'fedcba9876543210fedcba9876543210' > "$canary"

          set +e
          gitleaks dir "$canary_dir" \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --exit-code 23 >/dev/null 2>&1
          canary_status=$?
          set -e
          rm -f "$canary"
          rmdir "$canary_dir"

          if [ "$canary_status" -ne 23 ]; then
            echo "::error::Secret scanner canary was not detected, or the scanner failed."
            exit 1
          fi

      - name: Scan complete repository history
        shell: bash
        run: >-
          gitleaks git .
          --config .gitleaks.toml
          --redact
          --no-banner
          --verbose
